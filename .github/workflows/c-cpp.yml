name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: compile test
      run: gcc teste_espacopelotempo.c -o test_espacopelotempo -lm

    - name: execute test
      run: ./test_espacopelotempo

    - name: compile main
      run: gcc espacopelotempo.c -o espacopelotempo -lm

    - name: execute main
      run: ./espacopelotempo 40 2 3

    - name: mostrar o conteúdo do arquivo criado
      run: cat espacopelotempo.txt
